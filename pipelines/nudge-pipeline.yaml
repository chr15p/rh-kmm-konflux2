---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: update-bundle
spec:
  description: This tasks gets all the required data of an FBC build and commits it to a payload repository to be used in a GitOps environment.
  params:
  - name: snapshot
    type: string
  tasks:
  - name: update-bundle
    params:
      - name: SNAPSHOT
        value: "$(params.snapshot)"
    taskSpec:
      params:
      - name: SNAPSHOT
        type: string
      steps:
      - name: update-bundle
        image: quay.io/konflux-ci/release-service-utils@sha256:9b67510f1797cf3ef847400d0c8d58f0d62d881bbef833cd04ba6f241083e7e4
        envFrom:
        - secretRef:
            name: github-token
        script: |
          #!/usr/bin/bash -x
          SNAPSHOT_NAME=$(params.SNAPSHOT)
          SNAPSHOT_ID=$(echo $SNAPSHOT_NAME | awk -F'/' '{print $2}')
          if [[ -z "$SNAPSHOT_ID" ]]; then
              echo "ERROR: Could not extract SNAPSHOT_ID from: $(params.SNAPSHOT)"
              FINAL_EXIT_CODE=1
              exit 1
          fi
          SNAPSHOT_DATA=$(kubectl get snapshot $SNAPSHOT_ID -ojson)

          NAMESPACE=$(jq -r '.metadata.namespace' <<< "$SNAPSHOT_DATA")
          APPLICATION=$(jq -r '.spec.application' <<< "$SNAPSHOT_DATA")
          IMAGES=$(jq '.spec.components.[].containerImage | gsub("[\\n]"; ",")' <<< "$SNAPSHOT_DATA")
          IMAGES=$(echo $IMAGES | sed 's| |,\n|g' )
          IMAGESSTRING=$(echo $IMAGES | sed 's|"||g' )

          RELEASE_DIR=$(echo $APPLICATION | awk -F- '{print "release-"$2"."$3}')
          BRANCH="$RELEASE_DIR/latestrelease"


          ## Validate GITHUB_TOKEN
          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
              echo "ERROR: GITHUB_TOKEN environment variable is not set"
              FINAL_EXIT_CODE=1
              exit 1
          fi

          REPO_URL="https://github.com/chr15p/rh-kmm-konflux2.git"
          REPO_URL_WITH_AUTH=$(echo "$REPO_URL" | sed "s|https://|https://oauth2:${GITHUB_TOKEN}@|")

          git clone $REPO_URL_WITH_AUTH 
          cd rh-kmm-konflux2
          git checkout -b $BRANCH
          #git remote set-url origin "$REPO_URL_WITH_AUTH"
          git config user.name "release-pipeline"
          git config user.email "no-reply@redhat.com"

          RELEASE=$(awk -F= '/RELEASE/{print $2}' $RELEASE_DIR/build_settings.conf)
          FILENAME=$RELEASE_DIR/images-$RELEASE.json
          if [ ! -d "images/" ]; then
            mkdir images/
          fi

          OUTPUT="{\"snapshot\": \"$SNAPSHOT_NAME\", \"application\": \"$APPLICATION\", \"RELEASE\": \"$RELEASE\", \"images\": [ $IMAGES ] }"
          #echo $OUTPUT | jq > $RELEASE_DIR/lastrelease.json
          echo $OUTPUT | jq > $FILENAME

          git add $FILENAME

          git commit -m "update last release infomation for $SNAPSHOT_NAME"
          git push -u origin "$RELEASE_DIR/latestrelease"

          NUM=$(curl -X GET -L \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                https://api.github.com/repos/chr15p/rh-kmm-konflux2/pulls?head=chr15p:$BRANCH |  jq '.[].number')

          if [ -z "$NUM" ]; then
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/repos/chr15p/rh-kmm-konflux2/pulls \
              -d "{\"title\": \"$FILENAME updated for $RELEASE\", \
                  \"body\":\"$FILENAME updated\n${IMAGESSTRING}\", \
                  \"head\":\"$BRANCH\",\"base\":\"main\"}"
          else
            curl -L \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/repos/chr15p/rh-kmm-konflux2/pulls/$NUM \
              -d "{\"title\": \"$FILENAME updated for $RELEASE\", \
                  \"body\":\"$FILENAME updated on $(date):\n$IMAGESSTRING\", \
                  \"head\":\"$BRANCH\",\"base\":\"main\"}"
          fi

  workspaces:
  - name: git-auth
    optional: true
  - name: netrc
    optional: true
